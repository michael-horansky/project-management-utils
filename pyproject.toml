[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-management-utils"
version = "0.1.0"
description = "Python project utilities: Output logging, asynchronous progress bars, disk output/input management, AP scripting."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[tool.setuptools.packages.find]
where = ["src"]
